name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (+ Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.21"
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (incl. dev group)
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Eval quality gate
        env:
          LLM_BACKEND: fake
          MLFLOW_TRACKING_URI: sqlite:///mlflow_ci.db
        run: uv run python scripts/check_eval_gate.py

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: essential-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max