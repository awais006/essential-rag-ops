[project]
name = "essential-rag"
version = "0.1.0"
description = "Essential RAG: a keyword-retrieval RAG pipeline with automated LLM evaluation using MLflow, LangChain, and Ollama."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Awais" }]
dependencies = [
    "mlflow>=3.0",
    "langchain-ollama>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pydantic-settings>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
essential-rag = "essential_rag.evaluate:main"
rag-serve = "essential_rag.api:serve"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/essential_rag"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
